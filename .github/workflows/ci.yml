name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx react-scripts test --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: true
      # Solo lo que llega al navegador. Las herramientas de build (react-scripts)
      # arrastran avisos que no viajan al bundle; ver el issue #42.
      - name: Auditoría de dependencias de runtime
        run: npm audit --omit=dev --audit-level=high
