name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx react-scripts test --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: true
      # Solo dependencias de runtime: react-scripts, Tailwind y las librerías de
      # test son de desarrollo y arrastran avisos que no viajan al bundle (#42).
      - name: Auditoría de dependencias de runtime
        run: npm audit --omit=dev --audit-level=high
